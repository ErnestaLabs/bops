<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ernesta · Workflow canvas</title><link rel="stylesheet" href="style.css"></head><body>
<header><button id="menu" class="icon" title="Toggle workflow list" aria-label="Toggle workflow list">☰</button><strong class="brand">ERNESTA <span>/ Workflow canvas</span></strong><div class="spacer"></div><span class="design-tag">DESIGN · NOT LIVE</span><button id="system" class="secondary">System map</button><button id="export" class="secondary">Export SVG</button></header>
<div class="layout"><aside id="sidebar"><div class="sidebar-heading">WORKFLOWS <span id="count">32</span></div><input id="search" aria-label="Search workflows" placeholder="Find a workflow…" type="search"><nav id="flows" aria-label="Workflow list"></nav><div class="sidebar-foot">Connected steps, decisions and exceptions.<br>No live actions are triggered here.</div></aside>
<main><div class="workflow-head"><div><div id="category" class="eyebrow"></div><h1 id="title"></h1></div><button id="info" class="secondary" title="View workflow scope and source">Scope & source</button></div>
<div class="toolbar"><label>Trace a route <select id="path" aria-label="Trace a route"><option value="all">All branches</option></select></label><button id="next" class="secondary" disabled>Next step →</button><span id="trace-label" class="muted">Select a node to inspect it.</span><div class="spacer"></div><label class="check"><input id="exceptions" type="checkbox" checked> Exceptions</label><button id="fit" class="secondary" title="Fit diagram (F)">Fit</button><button id="minus" class="icon" aria-label="Zoom out">−</button><button id="zoom" class="zoom" title="Reset to 100%">100%</button><button id="plus" class="icon" aria-label="Zoom in">+</button><button id="fullscreen" class="icon" title="Fullscreen" aria-label="Fullscreen">⛶</button></div>
<div id="canvas" tabindex="0" aria-label="Interactive workflow diagram. Drag background to pan. Scroll to zoom. Select steps to inspect. Press F to fit.">
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Connected workflow diagram"><defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#d9dfe8"/></pattern><marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a91"/></marker><marker id="arrow-exception" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c75454"/></marker><marker id="arrow-recovery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7e69af"/></marker></defs><rect width="100%" height="100%" fill="url(#grid)"/><g id="world"></g></svg>
<div id="welcome" class="canvas-hint">Drag to pan <b>·</b> Scroll to zoom <b>·</b> Click a step for details</div>
<div id="inspector" hidden><div class="inspector-head"><span id="inspector-kicker">STEP</span><button id="close" aria-label="Close inspector">×</button></div><h2 id="inspector-title"></h2><div id="inspector-body"></div></div>
<div class="minimap-wrap"><svg id="minimap" aria-label="Diagram minimap" role="img"></svg></div>
</div><footer><div class="legend"><span><i class="normal"></i>Normal route</span><span><i class="exception"></i>Failure / blocked</span><span><i class="recovery"></i>Recovery</span><span>◇ Decision</span></div><span id="summary" class="muted"></span></footer>
</main></div><div id="toast" role="status"></div><script type="module" src="app.mjs"></script></body></html>
