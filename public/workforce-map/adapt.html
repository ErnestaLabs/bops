<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client workflow adapter</title><link rel="stylesheet" href="style.css"><style>
body{max-width:1180px;margin:auto;padding:30px}.adapt-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.panel input,.panel select,.panel textarea{width:100%;margin:6px 0 12px}.panel textarea{min-height:420px;background:#0a1421;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:13px/1.5 ui-monospace,monospace}.process{border-top:1px solid var(--line);padding:12px 0}.process b{color:var(--accent)}.gap{color:var(--amber)}pre{max-height:420px}.activate{margin-top:15px}@media(max-width:800px){.adapt-grid{grid-template-columns:1fr}}
</style></head><body><header style="padding:0 0 20px;height:auto"><a class="brand" href="./index.html">ERNESTA<span>CLIENT WORKFLOW COMPILER</span></a><span class="pill">Transcript → reviewed client version</span></header>
<div class="adapt-grid"><section class="panel"><div class="eyebrow">SOURCE</div><h2>Paste the sales or audit transcript</h2><label>Client ID<input id="client" placeholder="acme-ltd"></label><label>Transcript type<select id="type"><option value="sales">Sales call</option><option value="audit">Audit / discovery</option></select></label><textarea id="transcript" placeholder="Paste transcript here. The compiler is instructed to use only what the transcript supports."></textarea><button id="compile">Build client version</button><p id="status" class="muted"></p></section>
<section class="panel"><div class="eyebrow">CLIENT VERSION</div><h2 id="title">Nothing compiled yet</h2><div id="summary" class="notice">The generated version remains DRAFT until you approve its exact hash.</div><div id="processes"></div><div id="unknowns"></div><div class="activate" id="activation" hidden><p class="muted">Review hash</p><code id="hash"></code><br><br><button id="activate">Activate this exact version</button></div><pre id="raw"></pre></section></div>
<script type="module" src="adapt.mjs"></script></body></html>
